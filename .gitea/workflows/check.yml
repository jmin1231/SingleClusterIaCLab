name: check

on:
  workflow_call:

jobs:
  validate:
    runs-on: host
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly
      - run: terraform -chdir=terraform fmt -check -recursive
      - run: terraform -chdir=terraform validate
      - name: Scan IaC for misconfigurations (report only)
        run: trivy config --skip-dirs terraform/.terraform .
