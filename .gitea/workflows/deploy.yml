name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lab-deploy
  cancel-in-progress: false

jobs:
  check:
    uses: ./.gitea/workflows/check.yml
  image:
    needs: check
    uses: ./.gitea/workflows/image.yml
  terraform:
    needs: image
    uses: ./.gitea/workflows/terraform.yml
  ansible:
    needs: terraform
    uses: ./.gitea/workflows/ansible.yml
    secrets: inherit
