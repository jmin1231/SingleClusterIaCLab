# Hub: listen for each spoke and learn its endpoint from incoming traffic.
wg_interfaces:
  - name: wg0
    address: 10.99.0.1/24
    listen_port: 51820
    peer: fe-1
    allowed_ips:
      - 10.99.0.2/32  # frontend tunnel IP
      - 10.1.0.0/16  # frontend VPC

  - name: wg1
    address: 10.99.1.1/24
    listen_port: 51821
    peer: be-1
    allowed_ips:
      - 10.99.1.2/32  # backend tunnel IP
      - 10.3.0.0/16  # backend VPC
