# Wait until Flux has deployed this commit's app (kubernetes/apps) and it is healthy.
# Runs after app_secrets: the app needs db-authenticator before it can become healthy.

- name: Flux applied this commit to the app
  ansible.builtin.command:
    cmd: >-
      k3s kubectl -n flux-system wait kustomization/lab-apps
      --for=jsonpath={.status.lastAppliedRevision}=main@sha1:{{ lookup('env', 'GITHUB_SHA') }}
      --timeout=10s
  register: app_applied
  until: app_applied.rc == 0
  retries: 45                     # ~15 min: on a fresh build Flux may retry lab-apps (every 2 min) after the Secret lands, then CNPG pulls its image, runs initdb and clones the replica
  delay: 10
  changed_when: false
