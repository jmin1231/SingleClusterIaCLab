apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: lab-repo
  namespace: flux-system
spec:
  interval: 1m
  timeout: 60s
  url: https://gitea.lab.test/lab/lab.git
  ref:
    branch: main
  secretRef:
    name: flux-git-auth

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lab-apps
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  timeout: 3m
  path: ./kubernetes/apps
  prune: true
  wait: true
  dependsOn:
    - name: lab-cnpg              # the Cluster in apps/db needs CNPG's CRDs and operator (B09.8b)
  sourceRef:
    kind: GitRepository
    name: lab-repo

---
# Separate from lab-apps, so a monitoring failure never blocks the app's apply (B09.4 step 4)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lab-monitoring
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  timeout: 5m                     # first install pulls four images through Squid
  path: ./kubernetes/monitoring
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: lab-repo

---
# CloudNativePG operator (B09.8b). lab-apps waits for it: the Cluster in apps/db needs its CRDs.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lab-cnpg
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  timeout: 5m                     # first install pulls the chart and the operator image through Squid
  path: ./kubernetes/cnpg
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: lab-repo
