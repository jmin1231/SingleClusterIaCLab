apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: lab-repo
  namespace: flux-system
spec:
  interval: 1m
  timeout: 60s
  url: https://gitea.lab.test/lab/lab.git
  ref:
    branch: main
  secretRef:
    name: flux-git-auth

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: lab-apps
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 2m
  timeout: 3m
  path: ./kubernetes/apps
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: lab-repo
