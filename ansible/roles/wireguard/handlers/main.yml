- name: Apply sysctl
  ansible.builtin.command: sysctl -p /etc/sysctl.d/90-lab-forward.conf

- name: Restart wireguard
  ansible.builtin.systemd_service:
    name: "wg-quick@{{ item.name }}"
    state: restarted
  loop: "{{ wg_interfaces }}"

- name: Reload nftables
  ansible.builtin.systemd_service:
    name: nftables
    state: reloaded
