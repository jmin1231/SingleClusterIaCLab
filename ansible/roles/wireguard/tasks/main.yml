- name: The WireGuard private key exists (made once, stays on the VM)
  ansible.builtin.shell: >-
    umask 077 &&
    wg genkey > /etc/wireguard/private.key.tmp &&
    mv /etc/wireguard/private.key.tmp /etc/wireguard/private.key
  args:
    creates: /etc/wireguard/private.key

- name: Read this VM's WireGuard public key
  ansible.builtin.shell: wg pubkey < /etc/wireguard/private.key
  register: wg_public_key
  changed_when: false

- name: Wireguard interface has its config
  ansible.builtin.template:
    src: wg.conf.j2
    dest: "/etc/wireguard/{{ item.name }}.conf"
    owner: root
    group: root
    mode: "0600"
  loop: "{{ wg_interfaces }}"
  notify: Restart wireguard

# net.netfilter.* settings exist only once nf_conntrack is loaded; loading it at boot lets them apply after a reboot
- name: Hub loads conntrack before sysctl runs at boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/lab-conntrack.conf
    content: |
      nf_conntrack
    owner: root
    group: root
    mode: "0644"
  when: "'hub' in group_names"

# The hub filter is stateful, so every connection through tun-1 takes a conntrack entry. The 512 MB default (4096 entries,
# TIME_WAIT 120 s) fills at ~34 new connections/s and drops packets; 65536 entries and 30 s hold ~2200/s (~20 MB when full).
- name: Hub forwards traffic between tunnels
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-lab-forward.conf
    content: |
      net.ipv4.ip_forward = 1
      net.netfilter.nf_conntrack_max = 65536
      net.netfilter.nf_conntrack_tcp_timeout_time_wait = 30
    owner: root
    group: root
    mode: "0644"
  when: "'hub' in group_names"
  notify: Apply sysctl

- name: The hub's forward filter is installed
  ansible.builtin.copy:
    src: hub-forward.nft
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0644"
    validate: nft -c -f %s
  when: "'hub' in group_names"
  notify: Reload nftables

- name: nftables loads the filter now and at boot
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
    state: started
  when: "'hub' in group_names"

- name: Each WireGuard tunnel is enabled and running
  ansible.builtin.systemd_service:
    name: "wg-quick@{{ item.name }}"
    enabled: true
    state: started
  loop: "{{ wg_interfaces }}"
