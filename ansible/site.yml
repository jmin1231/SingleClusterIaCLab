- name: Terraform's inventory has all three VMs
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Each group has its VM
      ansible.builtin.assert:
        that: groups[item] | default([]) | length == 1
        fail_msg: "group {{ item }} has no VM; is the Terraform state there?"
      loop: [frontend, hub, backend]

- name: Every VM is ready, has the common setup and its WireGuard tunnels
  hosts: all
  gather_facts: false
  roles: [ready, common, wireguard]
  become: true

- name: be-1 runs k3s, Flux and the app database Secret
  hosts: backend
  gather_facts: false
  roles: [k3s, fluxcd, app_secrets]
  become: true

- name: fe-1 runs the frontend container
  hosts: frontend
  gather_facts: false
  roles: [frontend]
  become: true

- name: Every VM runs the Alloy monitoring agent
  hosts: all
  gather_facts: false
  roles: [alloy]
  become: true
