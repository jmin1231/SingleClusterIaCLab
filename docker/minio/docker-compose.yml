---
# MinIO — object storage for Terraform state and image artifacts (5.1).
#
# Terminates its own TLS and is NOT behind the proxy. That is Vault's
# arrangement (3.4-1) rather than Gitea's, and the reason is the payload: the
# state bucket holds every resource attribute Terraform knows, in plaintext, so
# the cleartext back-hop 2.5-2 accepted is worth declining for this one service.
# The cost, stated rather than discovered: a port in every endpoint URL, and a
# second certificate-renewal path that 3.5 has to cover alongside the proxy's.
#
# Credentials come from .env, rendered by minio-installer.sh out of Vault.
# Nothing here has a default — see docker/gitea/docker-compose.yml on why.
#
# No networks block: MinIO has no container peers. Everything reaches it the
# same way, over the published bridge port by name.

name: minio

services:
  minio:
    # Chainguard rather than minio/minio. Note this contradicts the note in
    # docker/toolbox/Dockerfile — that FORBIDDEN was the free tier refusing a
    # BASE image; the minio image pulls fine, and ships RELEASE.2026-07-17
    # against Docker Hub's RELEASE.2025-09-07.
    #
    # Pinned by digest per the house rule, but the tag has to stay `latest`:
    # the free tier publishes no version tags. Chainguard also rebuilds these
    # frequently for CVE patching and does not keep old digests forever, so
    # unlike the postgres and gitea pins this one can become UNPULLABLE rather
    # than merely stale. Re-pin when it does; do not drop the digest.
    #
    # Entrypoint is /usr/bin/minio directly, not a shell wrapper, so `command:`
    # below is arguments only — the same form minio/minio wanted, for a
    # different reason.
    image: cgr.dev/chainguard/minio:latest@sha256:1e408150bcf1bff07a2e468b9ac91347d4da261258921faeaedbe2ed7f0818b4
    container_name: minio
    restart: unless-stopped

    # Must equal MINIO_UID/MINIO_GID in minio-installer.sh; those are the only
    # two places this number may appear. 65101 and not Vault's 65100 — 3.1-1's
    # "the pattern, not the number", so neither service can read the other's key.
    user: "65101:65101"

    # --certs-dir is explicit BECAUSE user: is pinned. MinIO defaults to
    # $HOME/.minio/certs, and $HOME for uid 65101 is not /root and may not
    # resolve at all — naming the path removes the dependency entirely.
    #
    # --console-address binds the console to a port that is deliberately NOT
    # published below, so it exists but is unreachable from off-host. Bound
    # rather than left off: with no flag MinIO picks a RANDOM free port, and an
    # unknown listener is worse than a known one nothing routes to.
    command: server /data --certs-dir /certs --address :9000 --console-address :9001

    environment:
      # :? not :- — a missing credential must refuse to start. The fallback it
      # is refusing is MinIO's built-in minioadmin/minioadmin, which would come
      # up looking healthy and authenticate nobody who reads Vault.
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:?rendered into .env by minio-installer.sh}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:?rendered into .env by minio-installer.sh}
      # What MinIO builds presigned URLs and redirects from. Without it they
      # carry whatever address the request arrived on — the container's own,
      # which no client outside can resolve.
      - MINIO_SERVER_URL=https://minio.lab.test:9000

    # Bound to the bridge rather than 0.0.0.0, the same reasoning as Vault's
    # publish (3.1-2). MinIO is not behind the proxy, so this IS the way in and
    # the binding address is load-bearing rather than cosmetic.
    ports:
      - "${CLOUDBR0_IP:?generated into .env by minio-installer.sh}:9000:9000"

    volumes:
      - ./data:/data
      # public.crt and private.key; MinIO reads no other names. Read-only —
      # the key is 0400 owned by this uid and MinIO never writes here.
      - ./certs:/certs:ro

    # NO healthcheck, and that is a decision rather than an omission.
    #
    # This image ships neither curl nor wget, so the HTTP probe against
    # /minio/health/live cannot run here. `mc ready local` is MinIO's documented
    # substitute and does not work either: with `user:` pinned there is no home
    # directory, so mc cannot write its config ("mkdir /.mc: permission denied"),
    # and with MC_CONFIG_DIR pointed somewhere writable it RETRIES FOREVER
    # printing "The cluster 'local' is not ready" — there is no `local` alias to
    # resolve, and it blocks rather than failing. That is the worst shape a
    # healthcheck can have: docker kills it on timeout, every time, forever.
    #
    # Making it work needs MC_CONFIG_DIR plus MC_HOST_local carrying the root
    # credential in a URL — two more environment variables and a second copy of
    # the password, to prove something minio-installer.sh:wait_for_minio already
    # proves from the host with a real trust store and a real curl.
    # Revisit if anything ever needs `depends_on: condition: service_healthy`.

    logging:
      options:
        tag: minio
