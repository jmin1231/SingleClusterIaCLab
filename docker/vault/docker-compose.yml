# Vault — the lab's secret store, and from 3.4 its issuing CA.
#
# SKELETON. Comments only; every key below is a TODO in vault-installer.sh
# step 2. Written as comments rather than as keys with placeholder values,
# because a compose file that parses but is wrong is one `docker compose up`
# away from a Vault initialised against the wrong storage.
#
# The shape, following docker/coredns/docker-compose.yml:
#
#   name: vault
#
#   services:
#     vault:
#       image: ...            TODO 2.1  pinned, the way CoreDNS pins its tag.
#                             BUSL from 1.15; OpenBao is the Apache-2.0 fork
#       container_name: vault
#       restart: ...          TODO 2.5  unless-stopped makes CoreDNS self-heal
#                             and makes Vault come back SEALED — running,
#                             listening, refusing everything
#       cap_add: ...          TODO 1.6/2.x  IPC_LOCK, or disable_mlock instead
#       ports:
#         - "...:8200:8200"   TODO 1.3  the bind address decision, again — a
#                             bare "8200:8200" publishes on every interface
#       environment:
#         - VAULT_ADDR=...    the address the CLI *inside* the container uses;
#                             not the same value as api_addr, and confusing them
#                             is a common way to get redirects pointing inward
#       volumes:
#         - ./certs:...:ro    TODO 2.3  read-only. Vault never writes here.
#         - ./vault.hcl:...:ro
#         - ./data:...        TODO 2.2  the ownership trap: the container is not
#                             root, and a root-owned data dir fails operator init
#                             with an error that never says "ownership"
#       logging:
#         options:
#           tag: ...          TODO 2.4  CONTAINER_TAG per L-2, added now even
#                             though the journald driver switch has not happened
#
# Note what is absent: no healthcheck. `docker ps` reports the same state for a
# sealed Vault, an unreachable Vault and a working one, so a healthcheck here
# would report green for the two cases that matter. Step 5 asks Vault instead.
