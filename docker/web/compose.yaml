# docker/web/compose.yaml - the nginx from 1.2, as a file.
#
# compose.yaml is the spec's current filename; docker-compose.yml still works and
# is what most older material shows.

# The project's identity comes from this file rather than from the directory it
# happens to sit in. Without this, compose derives the name from the directory,
# and moving that directory renames every container, network and volume with it.
name: web

services:
  web:
    image: nginx:latest
    container_name: web
    ports:
      - "8080:80"
    labels:
      lab: singlecluster
    restart: unless-stopped
