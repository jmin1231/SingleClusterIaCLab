name: lab-gitea

services:
  gitea:
    image: docker.io/gitea/gitea:28.3.0-rootless@sha256:40c5a68a0463c0940e1ae32626c8300dd0572f3558e390073ad8379ca67c0e1d
    container_name: gitea
    restart: unless-stopped
    networks: [backend]
    environment:
      GITEA__server__DOMAIN: gitea.lab.test
      GITEA__server__ROOT_URL: https://gitea.lab.test/
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__DISABLE_SSH: "true"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__actions__ENABLED: "true"
    volumes:
      - gitea-data:/var/lib/gitea
      - gitea-config:/etc/gitea
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  backend:
    name: lab-backend
    external: true 

volumes:
  gitea-data:
  gitea-config: