# gitea-runner config, installed to /etc/lab-runner/config.yaml
log:
  level: info

runner:
  file: /var/lib/lab/runner/.runner
  capacity: 1
  timeout: 1h
  ca_file: /etc/lab-runner/ca.pem
  labels:
    - "host:host"
  envs:
    GIT_SSL_CAINFO: /etc/lab-runner/ca.pem

cache:
  enabled: false

host:
  workdir_parent: /var/lib/lab/runner/work
