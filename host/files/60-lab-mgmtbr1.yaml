# Installed by `bootstrap.sh up` to /etc/netplan/; `destroy` deletes it.
# Must match BRIDGE and VMNET in lib/config.py, and BRIDGE_ANCHOR in host/config/config.py.
network:
  version: 2
  dummy-devices:
    mgmtbr1-anchor: {}
  bridges:
    mgmtbr1:
      interfaces: [mgmtbr1-anchor]
      addresses: [10.250.0.1/24]
      nameservers:
        addresses: [10.250.0.1]
        search: [~lab.test]
      ignore-carrier: true
      parameters:
        stp: false
