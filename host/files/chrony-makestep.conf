# chrony.service drop-in: step the clock whenever it is more than 1 s off, not only in the first 3
# updates (Ubuntu's chrony.conf sets "makestep 1 3" after reading conf.d, so it can't be set there).
# After a VMware suspend/resume the host is hours behind; slewing would take days.
[Service]
ExecStartPost=-+/usr/bin/chronyc makestep 1 -1
