apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: db
resources:
  - namespace.yml
  - postgres.yaml
  - postgrest.yaml
  - postgrest-hpa.yaml
  - networkpolicy.yaml          # B09.7: default deny; Postgres only from PostgREST, PostgREST only from Traefik
configMapGenerator:
  - name: postgres-init
    files:
      - init.sql
    options:
      disableNameSuffixHash: true
