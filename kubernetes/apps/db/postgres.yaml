apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg
spec:
  instances: 2
  smartShutdownTimeout: 10        # default 180 s: PostgREST never disconnects, so a graceful delete stalled failover 3 min
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-minimal-trixie@sha256:c8caac9817d2b5e5e66297a3ccf86d9fcbd68f097aa6cc00161d83f9635e88cc
  storage:
    size: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  bootstrap:
    initdb:
      database: todo
      owner: app
      postInitApplicationSQLRefs:
        configMapRefs:
          - name: postgres-init
            key: init.sql
  managed:
    roles:
      - name: authenticator
        ensure: present
        login: true
        inherit: false
        inRoles:
          - api_anon
        passwordSecret:
          name: db-authenticator