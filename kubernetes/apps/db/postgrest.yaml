apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgrest
spec:
  selector:
    matchLabels:
      app: postgrest
  template:
    metadata:
      labels:
        app: postgrest
    spec:
      containers:
        - name: postgrest
          image: docker.io/postgrest/postgrest:v16.6@sha256:5ce030c153500fe90ba157da4da8ba99ab51d3bc7b95e071bd0b544b67a632f7
          ports:
            - name: http
              containerPort: 3000
            - name: admin
              containerPort: 3001
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-authenticator
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-authenticator
                  key: password
            - name: PGRST_DB_URI
              value: postgres://$(DB_USER):$(DB_PASSWORD)@pg-rw:5432/todo?connect_timeout=5   # no timeout: a connect during failover hung 136 s
            - name: PGRST_DB_SCHEMAS
              value: todo
            - name: PGRST_DB_ANON_ROLE
              value: api_anon
            - name: PGRST_ADMIN_SERVER_PORT
              value: "3001"
          readinessProbe:
            httpGet:
              path: /ready
              port: admin
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
---
# ClusterIP: Traefik owns be-1's port 8000 and reaches PostgREST through the Ingress below
apiVersion: v1
kind: Service
metadata:
  name: postgrest
spec:
  selector:
    app: postgrest
  ports:
    - name: http
      port: 3000
      targetPort: http
---
# No host rule: fe-1 calls by IP (http://10.3.1.10:8000)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: postgrest
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: postgrest
                port:
                  name: http
