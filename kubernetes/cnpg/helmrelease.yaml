# CloudNativePG operator 1.30.2 (chart 0.29.2): installs the CRDs and runs the operator that manages Postgres Clusters.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: flux-system
spec:
  interval: 10m
  releaseName: cnpg
  targetNamespace: cnpg-system
  install:
    createNamespace: true
  chartRef:
    kind: OCIRepository
    name: cnpg
  values:
    resources:              # be-1 has 4 GB; the chart sets none by default
      requests: { cpu: 50m, memory: 64Mi }
      limits:   { memory: 256Mi }
