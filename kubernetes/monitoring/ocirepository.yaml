# The chart as OCI from ghcr.io (already allowed in Squid); a classic HelmRepository has no proxy setting.
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: k8s-monitoring
  namespace: flux-system
spec:
  interval: 1h
  url: oci://ghcr.io/grafana/helm-charts/k8s-monitoring
  ref:
    tag: 4.6.1
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  proxySecretRef:
    name: flux-proxy
