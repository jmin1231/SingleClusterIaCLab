[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lab"
# The single source of truth for the version. lab/__init__.py should read it
# back with importlib.metadata rather than declaring it a second time — two
# copies drift, and `--version` lying is worse than not having it.
version = "0.1.0"
description = "A single-host infrastructure lab"
requires-python = ">=3.12"

# Empty on purpose. Add each library in the step that first needs it, not now:
# a dependency you cannot yet explain is one you cannot debug. Expected arrivals
# are cryptography (3.2), hvac (4.3) and jinja2 when templating starts.
dependencies = []

# Libraries the lab itself needs to run, installed with `pip install -e '.[dev]'`
# — note the quotes, or the shell eats the brackets.
#
# Linters are deliberately NOT here. They are tools you run, not things the lab
# depends on, so they are installed on the host rather than into this venv.
[project.optional-dependencies]
dev = []

# Settings for ruff when you run it by hand. Kept even though ruff is not a
# dependency: config and installation are separate questions, and this is what
# stops "works on my machine" being about line length.
[tool.ruff]
# 88 is ruff's own default, inherited from black. Not 79: PEP 8 wrote that for
# terminals that no longer exist, and the extra nine characters spare a lot of
# pointless wrapping.
line-length = 88

# The previous build. Nothing in it runs and nothing imports from it, so it must
# never be linted or reformatted — a diff there would be pure noise.
extend-exclude = ["old"]

[tool.ruff.lint]
# Deliberately small. E and F are the defaults — pycodestyle errors and pyflakes,
# which is "this is broken" rather than "this is not to my taste".
#
# I is import sorting, added because it is entirely mechanical, ruff fixes it
# automatically, and unsorted imports otherwise produce diff noise that hides
# real changes.
#
# Add a rule when one would have caught something that actually bit you. Forty
# rules chosen on day one is a linter you start ignoring on day three.
select = ["E", "F", "I"]
