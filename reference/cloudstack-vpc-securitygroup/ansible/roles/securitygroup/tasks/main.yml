- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: present
    update_cache: true
  
- name: Deploy nftables ruleset
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: "{{ nft_config_file }}"
    owner: root
    group: root
    mode: "0644"
    validate: "nft -c -f %s"
  notify: reload nftables

- name: Enable and start nftables
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started