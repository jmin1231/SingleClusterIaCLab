name: minio

volumes:
  minio-data:
  
services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    ports:
      - "${MINIO_BIND_IP:-0.0.0.0}:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    
  minio-client:
    image: cgr.dev/chainguard/minio-client:latest-dev
    container_name: minio-client
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minioadmin}"
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD 2>/dev/null; do
        echo 'waiting for minio...'; sleep 1;
      done &&
      mc mb --ignore-existing local/images &&
      mc anonymous set download local/images
      "