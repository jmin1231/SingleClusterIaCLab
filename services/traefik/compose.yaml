name: lab-traefik

services:
  traefik:
    image: docker.io/library/traefik:v3.7.19@sha256:aa942a00bce033c909bf1f7e861d93761be4b31a035f10d2410d33e38a8f41cf
    container_name: traefik
    restart: unless-stopped
    command:
      - --entrypoints.websecure.address=:8443
      - --entrypoints.websecure.http.tls=true
      - --providers.file.directory=/etc/traefik/dynamic
      - --log.level=INFO
      - --accesslog=true
    ports:
      - "10.250.0.1:443:8443"
    networks: [backend]
    volumes:
      - ./dynamic:/etc/traefik/dynamic:ro
      - ../../state/pki/gateway.pem:/etc/traefik/tls/gateway.pem:ro
      - ../../state/pki/gateway-key.pem:/etc/traefik/tls/gateway-key.pem:ro
    cap_drop: [ALL]

networks:
  backend:
    name: lab-backend
