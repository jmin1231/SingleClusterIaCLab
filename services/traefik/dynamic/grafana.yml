http:
  routers:
    grafana:        # the UI: host only (no VM needs Grafana)
      rule: "Host(`grafana.lab.test`)"
      entryPoints: [websecure]
      middlewares: [host-only]
      service: grafana

  services:
    grafana:
      loadBalancer:
        servers:
          - url: "http://grafana:3000"
