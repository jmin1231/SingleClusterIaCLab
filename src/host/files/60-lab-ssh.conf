# Installed by bootstrap.sh to /etc/ssh/ssh_config.d/ (src/host/ssh_access.py); destroy deletes it.
# `ssh fe-1`, `ssh tun-1`, `ssh be-1` from the host, over the mgmt network (cloudbr1).
# The addresses must match mgmt_ip in terraform/compute.tf.
# Host key checking is off: the VMs get new host keys on every rebuild, on a private network of a short-lived lab.

Host fe-1 tun-1 be-1
    User user
    IdentityFile ~/.ssh/lab_operator
    IdentitiesOnly yes
    StrictHostKeyChecking no
    UserKnownHostsFile /dev/null
    LogLevel ERROR

Host fe-1
    HostName 10.250.0.110

Host tun-1
    HostName 10.250.0.111

Host be-1
    HostName 10.250.0.112
