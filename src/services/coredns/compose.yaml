name: lab-coredns

services:
  coredns:
    image: docker.io/coredns/coredns:1.12.1@sha256:e8c262566636e6bc340ece6473b0eed193cad045384401529721ddbe6463d31c
    container_name: coredns
    restart: unless-stopped
    network_mode: host
    environment:
      HOST_IP: ${HOST_IP}
    volumes:
      - ./conf:/etc/coredns:ro
    command: ["-conf", "/etc/coredns/Corefile"]
