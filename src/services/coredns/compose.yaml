name: lab-coredns

services:
  coredns:
    image: docker.io/coredns/coredns:1.15.0@sha256:0a9d8c8ddf34347eb59aad9a8784f0710de88d6d112726d11d271f9bc6daca26
    container_name: coredns
    restart: unless-stopped
    network_mode: host
    environment:
      HOST_IP: ${HOST_IP}
    volumes:
      - ./conf:/etc/coredns:ro
    command: ["-conf", "/etc/coredns/Corefile"]
