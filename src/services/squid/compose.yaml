name: lab-squid

services:
  squid:
    image: docker.io/ubuntu/squid:7.2-26.04_edge@sha256:42decc7f79b4e1044f4fe9b3a855af2cbfc76652f3191694726e21058443edc9
    container_name: squid
    restart: unless-stopped
    network_mode: host  # listens on 10.250.0.1:3128 (http_port in squid.conf)
    environment:
      SQUID_CONF_HASH: ${SQUID_CONF_HASH:-}  # set by squid.up(): a changed squid.conf recreates the container
    volumes:
      - ./conf:/etc/squid-lab:ro  # its own path: the image's /etc/squid still has mime.conf and error pages
    # The image's default is pebble -> entrypoint.sh -> /etc/squid/squid.conf; run the binary directly instead.
    # squid-gnutls is the Squid binary in this image; -N foreground, -d 1 startup errors to podman logs.
    entrypoint: ["squid-gnutls", "-N", "-d", "1", "-f", "/etc/squid-lab/squid.conf"]
    cap_drop: [ALL]  # the image runs as _daemon_ (UID 584792), never root, so no capability is needed
