# Egress proxy for the lab VMs (build-order.md B08.1). vmfw gives them no route out, so this is
# their only way to the internet: only from the mgmt network, only to the package hosts below.
http_port 10.250.0.1:3128

acl vms src 10.250.0.0/24
acl pkg_hosts dstdomain .archive.ubuntu.com security.ubuntu.com
acl Safe_ports port 80 443
acl SSL_ports port 443
acl CONNECT method CONNECT
acl ftp proto FTP

# First match wins
http_access deny ftp                  # no FTP gateway at all (Squidbleed, CVE-2026-47729)
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports   # HTTPS tunnels only to 443
http_access allow vms pkg_hosts
http_access deny all

cache deny all
access_log daemon:/var/log/squid/access.log   # /var/log/squid belongs to the image's user
pid_filename none                             # /run is root's; a config change recreates the container instead
