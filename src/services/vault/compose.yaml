name: lab-vault

services:
  vault:
    image: docker.io/hashicorp/vault:2.2.1@sha256:962a92876e168d68eaaa24b0b8b49bbce1cb63024060a67bba95cd158a366fc2
    container_name: vault
    restart: unless-stopped
    command: ["server"]
    ports:
      - "10.250.0.1:8200:8200"
    networks: [vault]
    environment:
      VAULT_ADDR: https://127.0.0.1:8200
      VAULT_CACERT: /vault/tls/ca.pem
    volumes:
      - ./vault.hcl:/vault/config/vault.hcl:ro
      # Three files, not state/pki/: the CA keys must never be inside a container.
      - ../../../state/pki/vault.pem:/vault/tls/vault.pem:ro
      - ../../../state/pki/vault-key.pem:/vault/tls/vault-key.pem:ro
      - ../../../state/pki/ca.pem:/vault/tls/ca.pem:ro
      - vault-data:/vault/file
    cap_drop: [ALL]
    # no no-new-privileges: with Ubuntu's AppArmor it makes socket() fail (permission denied)
    healthcheck:
      test: ["CMD-SHELL", "vault status >/dev/null; [ $$? -ne 1 ]"]
      interval: 10s
      timeout: 5s
      retries: 3

networks:
  vault:
    name: lab-vault

volumes:
  vault-data: {}
